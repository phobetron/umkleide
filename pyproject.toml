[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "umkleide"
version = "0.1.0"
description = "A local MCP server for managing outfit references and generating images."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Umkleide contributors" }]
dependencies = [
  "filelock>=3.21,<4",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
]

[project.scripts]
umkleide-mcp = "umkleide.cli:main"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
